server {
    listen 127.0.0.1:18080;
    server_name _;
    absolute_redirect off;

    client_max_body_size 0;

    location = /_cloud_auth {
        internal;
        proxy_pass http://127.0.0.1:18081/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    location = /login {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
    }

    location = /cloud-health {
        proxy_pass http://127.0.0.1:18081/healthz;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    # Windows File Explorer-style frontend. The old FileBrowser UI route is no
    # longer exposed; FileBrowser remains the internal file API provider.
    location = / {
        return 302 /explorer/;
    }

    location = /explorer {
        return 302 /explorer/;
    }

    location = /files {
        return 302 /explorer/;
    }

    location ^~ /files/ {
        return 302 /explorer/;
    }

    location ^~ /explorer/ {
        auth_request /_cloud_auth;
        error_page 401 = @login_redirect;

        root /usr/local/share/rk-cloud;
        index index.html;
        try_files $uri $uri/index.html =404;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        auth_request /_cloud_auth;
        auth_request_set $cloud_user $upstream_http_x_cloud_user;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-User $cloud_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
